<style>
:root{
  --ink:#111315; --ink-2:#181b1e; --ivory:#F5F2EB; --stone:#D8D4CC; --warm:#B9B5AE; --muted:#77746E; --gold:#A99A78;
  --text-soft:#55524d; --gold-ink:#7A6C4B;
  --hair:rgba(17,19,21,.16); --hair-d:rgba(245,242,235,.16);
  --serif:"Cormorant Garamond","Libre Baskerville",Georgia,serif;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --pad:clamp(20px,5vw,64px);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(120px + env(safe-area-inset-top,0px));height:auto}
body{margin:0;background:var(--ink);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;padding-bottom:env(safe-area-inset-bottom,0px)}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ivory);color:var(--ink);padding:12px 18px;z-index:200}
.skip:focus{left:12px;top:calc(12px + env(safe-area-inset-top,0px))}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding-inline:var(--pad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sections */
.sec{padding-block:clamp(80px,11vw,152px);position:relative}
.light{background:var(--ivory);color:var(--ink)}
.stone{background:var(--stone);color:var(--ink)}
.dark{background:var(--ink);color:var(--ivory)}
.dark2{background:var(--ink-2);color:var(--ivory)}
.soft{color:var(--text-soft)}
.dark .soft,.dark2 .soft{color:var(--warm)}
.eyebrow{display:flex;align-items:center;gap:14px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--gold-ink);margin-bottom:28px}
.eyebrow::before{content:"";width:32px;height:1px;background:currentColor}
.dark .eyebrow,.dark2 .eyebrow{color:var(--gold)}
.display{font-size:clamp(2.7rem,6.6vw,6rem);line-height:1.02;font-weight:400}
.h2{font-size:clamp(2.2rem,4.4vw,3.9rem);line-height:1.08}
.h3{font-size:clamp(1.55rem,2.2vw,2rem);line-height:1.18}
.lede{font-size:clamp(1.05rem,1.4vw,1.2rem);line-height:1.7;max-width:62ch}
.serif-q{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw,2.1rem);line-height:1.28}
.meta{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.sechead{display:grid;grid-template-columns:1fr;gap:28px;margin-bottom:clamp(48px,6vw,88px)}
@media(min-width:980px){.sechead{grid-template-columns:5fr 7fr;gap:64px;align-items:end}}
.rline{height:1px;background:var(--hair);position:relative;margin-block:clamp(36px,5vw,64px)}
.rline::before{content:"";position:absolute;left:0;top:-1px;width:72px;height:3px;background:var(--gold)}
.dark .rline,.dark2 .rline{background:var(--hair-d)}

/* buttons & links */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;padding:17px 30px;border:1px solid var(--ink);background:var(--ink);color:var(--ivory);font-size:13px;letter-spacing:.06em;font-weight:500;text-decoration:none;transition:background .5s var(--ease),color .5s var(--ease),border-color .5s var(--ease);text-align:center}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--ivory)}
.dark .btn,.dark2 .btn{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.dark .btn:hover,.dark2 .btn:hover{background:transparent;color:var(--ivory)}
.dark .btn.ghost,.dark2 .btn.ghost{background:transparent;color:var(--ivory);border-color:var(--hair-d);border-color:rgba(245,242,235,.4)}
.dark .btn.ghost:hover,.dark2 .btn.ghost:hover{background:var(--ivory);color:var(--ink)}
.btn.sm{padding:12px 20px;font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:14px;margin-top:40px}
.link{text-decoration:none;background:linear-gradient(currentColor,currentColor) left bottom/0 1px no-repeat;padding-bottom:3px;transition:background-size .6s var(--ease);border-bottom:1px solid rgba(128,124,116,.45);font-weight:500;font-size:14px;letter-spacing:.02em}
.link:hover{background-size:100% 1px}
.tlink{display:inline-block;margin-top:28px}

/* header */
#hdr{position:sticky;top:0;z-index:100;background:var(--ink);color:var(--ivory);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--hair-d)}
.util{display:none;border-bottom:1px solid var(--hair-d);font-size:11.5px;letter-spacing:.08em;color:var(--warm);transition:margin .5s var(--ease),opacity .4s}
.util .wrap{max-width:1500px;display:flex;justify-content:space-between;align-items:center;height:36px}
.util a,.util button{color:var(--warm);text-decoration:none;background:none;border:0;padding:0;font-size:11.5px;letter-spacing:.08em;transition:color .3s}
.util a:hover,.util button:hover{color:var(--ivory)}
.util nav{display:flex;gap:26px}
#hdr.scrolled .util{margin-top:-37px;opacity:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:24px;height:72px;max-width:1500px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ivory)}
.brand .logo{width:38px;height:auto;flex:none}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:25px;letter-spacing:.34em;line-height:1;margin-right:-.34em}
.brand small{display:block;white-space:nowrap;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--warm);margin-top:5px}
#nav{display:none;gap:clamp(12px,1.1vw,22px)}
#nav a{font-size:12.5px;letter-spacing:.03em;text-decoration:none;color:var(--warm);position:relative;padding:8px 0;transition:color .3s;white-space:nowrap}
#nav a::after{content:"";position:absolute;left:0;bottom:2px;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
#nav a:hover,#nav a.on{color:var(--ivory)}
#nav a:hover::after,#nav a.on::after{transform:scaleX(1)}
.hcta{display:none;white-space:nowrap;flex:none}
#burger{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:12px;margin-right:-12px}
#burger span{display:block;width:26px;height:1px;background:var(--ivory);transition:transform .5s var(--ease),opacity .3s}
#burger[aria-expanded=true] span:first-child{transform:translateY(3.5px) rotate(45deg)}
#burger[aria-expanded=true] span:last-child{transform:translateY(-3.5px) rotate(-45deg)}
@media(min-width:1340px){.util{display:block}#nav{display:flex}.hcta{display:inline-flex}#burger{display:none}}
#menu{position:fixed;inset:0;z-index:90;background:var(--ink);color:var(--ivory);padding:calc(100px + env(safe-area-inset-top,0px)) var(--pad) 40px;overflow-y:auto;opacity:0;visibility:hidden;transition:opacity .5s var(--ease),visibility .5s}
#menu.open{opacity:1;visibility:visible}
#menu a.m{display:block;font-family:var(--serif);font-size:clamp(1.9rem,6vw,2.6rem);text-decoration:none;padding:8px 0;line-height:1.15;border-bottom:1px solid var(--hair-d)}
#menu .btn{width:100%;margin-top:28px}
#menu .sub{display:flex;flex-wrap:wrap;gap:20px;margin-top:28px;font-size:13px;color:var(--warm)}
#menu .sub a,#menu .sub button{color:var(--warm);background:none;border:0;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:4px}
#prog{position:fixed;left:0;top:0;height:2px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;z-index:300;pointer-events:none}

/* loader */
#loader{position:fixed;inset:0;z-index:400;background:var(--ink);color:var(--ivory);display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;transition:opacity .9s var(--ease),visibility .9s}
.has-loader #loader{display:flex}
#loader.done{opacity:0;visibility:hidden}
#loader .logo{width:76px;opacity:0;animation:fadein 1s var(--ease) .1s forwards}
#loader .w1,#loader .w2{opacity:0;animation:fadein .8s var(--ease) forwards}
#loader .w1{font-family:var(--serif);font-size:34px;letter-spacing:.4em;margin:26px -.4em 0 0;animation-delay:.9s}
#loader .w2{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--warm);margin-top:12px;animation-delay:1.5s}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}

/* hero */
.hero{position:relative;min-height:calc(100vh - 110px);min-height:calc(100svh - 110px);display:flex;align-items:flex-end;overflow:hidden;background:var(--ink);color:var(--ivory)}
.hero-art{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;z-index:2;padding-block:clamp(72px,12vh,140px) clamp(48px,8vh,88px)}
.hero h1{max-width:15ch;font-size:clamp(2.6rem,5.6vw,5.2rem)}
.hero .lede{margin-top:36px;color:var(--stone)}
.hero .tag{position:absolute;right:var(--pad);bottom:clamp(40px,7vh,72px);z-index:2;display:none;font-family:var(--serif);font-style:italic;font-size:1.15rem;color:var(--warm);text-align:right}
@media(min-width:1100px){.hero .tag{display:block}}
.hero-r{position:absolute;right:4vw;top:50%;transform:translateY(-50%);height:64%;color:var(--gold);opacity:.4;pointer-events:none}
.hero-r path{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.2s var(--ease) 1.2s forwards}
.has-loader .hero-r path{animation-delay:3s}
.page-hero{background:var(--ink);color:var(--ivory);padding-block:clamp(88px,12vw,168px) clamp(64px,8vw,112px);position:relative;overflow:hidden}
.page-hero .wrap{position:relative;z-index:1}
.page-hero h1{font-size:clamp(2.6rem,6vw,5.4rem);line-height:1.04;max-width:18ch}
.page-hero .lede{margin-top:32px;color:var(--stone)}
.page-hero .wm{position:absolute;right:-2vw;top:50%;transform:translateY(-50%);height:140%;color:var(--gold);opacity:.1;pointer-events:none}

/* strip */
.strip{background:var(--ink-2);color:var(--ivory);border-top:1px solid var(--hair-d);border-bottom:1px solid var(--hair-d)}
.strip ul{display:grid;grid-template-columns:repeat(2,1fr)}
.strip li{padding:26px 8px;font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--warm);border-bottom:1px solid var(--hair-d)}
@media(min-width:900px){.strip ul{grid-template-columns:repeat(5,1fr)}.strip li{padding:32px 0 32px 24px;border-bottom:0;border-left:1px solid var(--hair-d)}.strip li:first-child{border-left:0;padding-left:0}}

/* standard */
.pillars li{display:grid;grid-template-columns:56px 1fr;gap:8px 20px;padding:32px 0;border-top:1px solid var(--hair);position:relative}
.pillars li:last-child{border-bottom:1px solid var(--hair)}
.pillars li::before{content:"";position:absolute;left:0;top:-1px;height:1px;width:0;background:var(--gold);transition:width .8s var(--ease)}
.pillars li:hover::before{width:100%}
.pillars .n{font-size:12px;letter-spacing:.14em;color:var(--gold-ink);padding-top:12px;font-weight:500}
.pillars h3{font-size:clamp(1.8rem,3vw,2.6rem)}
.pillars p{grid-column:2;color:var(--text-soft);max-width:48ch}
@media(min-width:760px){.pillars li{grid-template-columns:72px 280px 1fr;align-items:baseline}.pillars p{grid-column:auto}}
.split{display:grid;gap:48px}
@media(min-width:980px){.split{grid-template-columns:4fr 8fr;gap:80px}.split .stick{position:sticky;top:140px;align-self:start}}

/* numbers */
.nums{display:grid;grid-template-columns:1fr;border-top:1px solid var(--hair-d)}
.num{padding:44px 0;border-bottom:1px solid var(--hair-d);position:relative}
.num .v{font-family:var(--serif);font-size:clamp(3.8rem,7vw,6.5rem);line-height:.95;white-space:nowrap;font-weight:400;letter-spacing:-.02em;color:var(--ivory)}
.num .v.ph{color:rgba(245,242,235,.2)}
.num .l{margin-top:18px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--warm);font-weight:500}
.num .tick{position:absolute;left:0;top:-1px;height:3px;width:56px;background:var(--gold)}
@media(min-width:760px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.num:nth-child(odd){padding-right:40px;border-right:1px solid var(--hair-d)}.num:nth-child(even){padding-left:48px}}
@media(min-width:1100px){.nums{grid-template-columns:repeat(3,minmax(0,1fr))}.num,.num:nth-child(odd),.num:nth-child(even){padding:56px 40px 56px 40px;border-right:1px solid var(--hair-d)}.num:nth-child(3n){border-right:0}.num:nth-child(3n+1){padding-left:0}}
.note{font-size:12.5px;color:var(--muted);margin-top:28px;max-width:70ch;line-height:1.6}
.dark .note,.dark2 .note{color:var(--warm);opacity:.8}

/* practices */
.cols3{display:grid;gap:0}
.cols3>article{padding:36px 0 44px;border-top:1px solid var(--hair)}
.cols3 h3{font-size:clamp(2rem,3vw,2.8rem);margin-bottom:20px}
@media(min-width:900px){.cols3{grid-template-columns:repeat(3,1fr)}.cols3>article{padding:44px 40px 56px;border-left:1px solid var(--hair)}.cols3>article:first-child{padding-left:0;border-left:0}}
.dark .cols3>article{border-color:var(--hair-d)}

/* tabs / panel */
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--hair)}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:14px 22px 14px 0;margin-right:22px;font-size:13px;letter-spacing:.06em;color:var(--text-soft);transition:color .3s,border-color .4s}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
.dark .tabs,.dark2 .tabs{border-color:var(--hair-d)}
.dark .tabs button,.dark2 .tabs button{color:var(--warm)}
.dark .tabs button[aria-selected=true],.dark2 .tabs button[aria-selected=true]{color:var(--ivory)}
.panel{padding-top:48px;display:grid;gap:36px}
@media(min-width:900px){.panel{grid-template-columns:5fr 7fr;gap:72px}}
.panel h3{font-size:clamp(2rem,3.6vw,3.2rem);margin-bottom:16px}
.panel .themes{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-block;border:1px solid var(--hair);padding:7px 13px;font-size:12.5px;letter-spacing:.02em;background:transparent}
.dark .chip,.dark2 .chip{border-color:var(--hair-d)}
.panel-enter{animation:pin .6s var(--ease)}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* signals */
.signals{display:grid;gap:20px;margin-top:64px}
@media(min-width:900px){.signals{grid-template-columns:repeat(3,1fr)}}
.sig{border:1px solid var(--hair);padding:30px 28px 34px;background:rgba(255,255,255,.35);transition:transform .6s var(--ease),background .6s,box-shadow .6s;position:relative}
.sig:hover{transform:translateY(-3px);background:rgba(255,255,255,.6);box-shadow:0 14px 30px -22px rgba(17,19,21,.4)}
.sig .meta{color:var(--gold-ink);display:block;margin-bottom:16px}
.sig p{font-family:var(--serif);font-size:1.45rem;line-height:1.3}
.sig::before{content:"";position:absolute;left:-1px;top:-1px;width:3px;height:36px;background:var(--gold)}
.stone .sig{background:rgba(245,242,235,.45)}

/* grids */
.grid{display:grid;gap:0;border-top:1px solid var(--hair)}
.dark .grid,.dark2 .grid{border-color:var(--hair-d)}
.cell{padding:30px 24px 34px 0;border-bottom:1px solid var(--hair)}
.dark .cell,.dark2 .cell{border-color:var(--hair-d)}
.cell .n{font-size:12px;letter-spacing:.14em;color:var(--gold-ink);font-weight:500;display:block;margin-bottom:22px}
.dark .cell .n,.dark2 .cell .n{color:var(--gold)}
.cell h3{font-size:1.75rem;margin-bottom:10px}
.cell p{color:var(--text-soft);font-size:15px;max-width:42ch}
.dark .cell p,.dark2 .cell p{color:var(--warm)}
.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr}
@media(min-width:700px){.g2,.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
 .g3 .cell,.g4 .cell,.g2 .cell{padding-left:28px;border-left:1px solid var(--hair)}
 .dark .g3 .cell,.dark .g4 .cell,.dark .g2 .cell{border-left-color:var(--hair-d)}
 .g3 .cell:nth-child(3n+1),.g4 .cell:nth-child(4n+1){padding-left:0;border-left:0}}
@media(min-width:700px) and (max-width:999px){.g2 .cell:nth-child(even),.g3 .cell:nth-child(even),.g4 .cell:nth-child(even){padding-left:28px;border-left:1px solid var(--hair)}}
.dark .g2 .cell:nth-child(even),.dark .g3 .cell:nth-child(even){border-left-color:var(--hair-d)}
.cell.hl{background:rgba(169,154,120,.1)}

/* process */
.steps{position:relative;counter-reset:s;padding-left:0}
.steps li{display:grid;grid-template-columns:64px 1fr;gap:6px 20px;padding:0 0 clamp(40px,5vw,64px);position:relative}
.steps li::before{content:"";position:absolute;left:23px;top:44px;bottom:6px;width:1px;background:var(--hair)}
.steps li:last-child::before{display:none}
.steps .dot{width:47px;height:47px;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.08em;color:var(--gold-ink);background:var(--ivory);position:relative;z-index:1;transition:background .6s var(--ease),color .6s}
.steps li.in .dot{background:var(--ink);color:var(--gold)}
.dark .steps .dot{background:var(--ink);color:var(--gold)}
.dark .steps li.in .dot{background:var(--gold);color:var(--ink)}
.dark .steps li::before{background:var(--hair-d)}
.steps h3{font-size:clamp(1.8rem,3vw,2.5rem);padding-top:4px}
.steps p{grid-column:2;color:var(--text-soft);max-width:54ch}
.dark .steps p{color:var(--warm)}
.hsteps{display:grid;gap:0;border-top:1px solid var(--hair-d)}
.hsteps>li{padding:28px 0;border-bottom:1px solid var(--hair-d)}
.hsteps .n{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold);margin-bottom:18px}
.hsteps h3{font-size:1.55rem;margin-bottom:10px}
.hsteps p{font-size:14.5px;color:var(--warm)}
@media(min-width:1000px){.hsteps{grid-template-columns:repeat(var(--cols,5),1fr);border-bottom:1px solid var(--hair-d)}.hsteps>li{padding:34px 24px 40px;border-bottom:0;border-left:1px solid var(--hair-d)}.hsteps>li:first-child{padding-left:0;border-left:0}}
.light .hsteps,.stone .hsteps{border-color:var(--hair)}
.light .hsteps>li,.stone .hsteps>li{border-color:var(--hair)}
.light .hsteps p,.stone .hsteps p{color:var(--text-soft)}
.light .hsteps .n,.stone .hsteps .n{color:var(--gold-ink)}

/* statements */
.stmts li{font-family:var(--serif);font-size:clamp(1.9rem,4.2vw,3.7rem);line-height:1.12;padding:28px 0;border-top:1px solid var(--hair)}
.stmts li:last-child{border-bottom:1px solid var(--hair)}

 const L=5;for(let i=0;i<L;i++){const t=document.createElementNS(ns,'text');t.setAttribute('text-anchor','middle');svg.appendChild(t);labs.push(t);}
 function layout(d){
  const cats=DIMS[d],k=cats.length;
  const centers=cats.map((_,j)=>{
   const cols=k<=3?k:(k===4?2:3);const rows=Math.ceil(k/cols);
   const cx=900*((j%cols)+.5)/cols,cy=560*(Math.floor(j/cols)+.5)/rows;return [cx,cy-6];});
  nodes.forEach((n,i)=>{
   const j=n.a%k;const ctr=centers[j];const ang=n.o[0]*Math.PI*2,rad=26+n.o[1]*(k<=3?95:70);
   const x=ctr[0]+Math.cos(ang)*rad*1.25,y=ctr[1]+Math.sin(ang)*rad*.9+8;
   dots[i].setAttribute('cx',x.toFixed(1));dots[i].setAttribute('cy',y.toFixed(1));
   lines[i].setAttribute('x1',ctr[0]);lines[i].setAttribute('y1',ctr[1]+8);lines[i].setAttribute('x2',x.toFixed(1));lines[i].setAttribute('y2',y.toFixed(1));
  });
  labs.forEach((t,j)=>{if(j<k){t.textContent=cats[j];t.setAttribute('x',centers[j][0]);t.setAttribute('y',centers[j][1]-(k<=3?118:92));t.style.opacity=1;}else{t.style.opacity=0;}});
 }
 if(reduce){layout(0);}else{nodes.forEach((n,i)=>{dots[i].setAttribute('cx',450);dots[i].setAttribute('cy',280);lines[i].setAttribute('x1',450);lines[i].setAttribute('y1',280);lines[i].setAttribute('x2',450);lines[i].setAttribute('y2',280);});labs.forEach(t=>t.style.opacity=0);const mo=new IntersectionObserver(es=>{if(es[0].isIntersecting){mo.disconnect();setTimeout(()=>layout(0),250);}},{threshold:.3});mo.observe(svg);}
 if(reduce)svg.querySelectorAll('*').forEach(e=>e.style.transition='none');
 $$('#dims button').forEach(b=>b.addEventListener('click',()=>{$$('#dims button').forEach(x=>x.setAttribute('aria-pressed',x===b));layout(+b.dataset.d);}));
}

/* ---------- mandate builder ---------- */
function initMandate(){
 const root=$('#wz');if(!root)return;
 const d={};let step=0;
 const F=R.__fld||null; const f=P.fld;
 const caps=['Strategic leadership','Transformation','Technology and AI fluency','Financial discipline','Operating excellence','Stakeholder and investor engagement','Governance and risk','Talent and culture','Commercial growth','International experience'];
 const steps=[
  {t:'The organization and role',h:()=>`<div class="frow two">${f('m-org','Organization (use a descriptor if confidential)',{req:1})}${f('m-ind','Industry',{req:1,sel:INDUSTRIES.map(i=>i.n).concat(['Other'])})}</div><div class="frow">${f('m-role','Role to be filled',{req:1,ph:'e.g. Chief Executive Officer, Non-Executive Director'})}</div>`},
  {t:'Business context',h:()=>`<div class="frow">${f('m-ch','What is the business challenge?',{req:1,area:1})}</div><div class="frow two">${f('m-stage','Growth stage',{req:1,sel:['Early stage','Scaling','Established','Mature','In turnaround or transition']})}${f('m-geo','Geography',{req:1})}</div><div class="frow">${f('m-tf','Transformation agenda (optional)',{area:1})}</div>`},
  {t:'Leadership requirements',h:()=>`<div class="frow">${f('m-pri','Leadership priorities for the first 12–24 months',{req:1,area:1})}</div><fieldset><legend class="sr">Required capabilities</legend><p class="meta" style="margin-bottom:12px;color:var(--text-soft)">Required capabilities (choose up to five)</p><div class="chips" id="m-caps">${caps.map((c,i)=>`<label><input type="checkbox" value="${c}"><span>${c}</span></label>`).join('')}</div></fieldset><div class="frow">${f('m-board','Board involvement',{sel:['Reports to the board','Works closely with a committee','Limited board exposure','This is a board role']})}</div>`},
  {t:'Confidentiality and timeline',h:()=>`<div class="frow two">${f('m-conf','Confidentiality level',{req:1,sel:['Highly confidential','Confidential','Standard']})}${f('m-time','Desired timeline',{req:1,sel:['Urgent (as soon as possible)','Within 3 months','3 to 6 months','Flexible']})}</div><p class="note">Please do not enter names of individuals or other information you would not want shown on screen.</p>`}
 ];
 function draw(){
  const s=steps[step];
  root.innerHTML=`<div class="wizard-top" aria-hidden="true">${steps.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><form id="wf" novalidate><p class="meta" style="color:var(--gold-ink);margin-bottom:10px">Step ${step+1} of ${steps.length}</p><h2 class="h2" style="margin-bottom:32px" tabindex="-1" id="wh">${s.t}</h2>${s.h()}<div class="wnav">${step>0?'<button type="button" class="btn ghost" id="wb">Back</button>':'<span></span>'}<button class="btn" type="submit">${step===steps.length-1?'Generate the brief':'Continue'}</button></div></form>`;
  Object.keys(d).forEach(k=>{const el=$('#'+k,root);if(el&&el.type!=='checkbox')el.value=d[k];});
  if(step===2&&d.caps)$$('#m-caps input').forEach(i=>i.checked=d.caps.includes(i.value));
  if(step===2)$('#m-caps').addEventListener('change',e=>{if($$('#m-caps input:checked').length>5){e.target.checked=false;}});
  $('#wh').focus({preventScroll:true});
  const back=$('#wb');if(back)back.onclick=()=>{save();step--;draw();};
  $('#wf').addEventListener('submit',e=>{e.preventDefault();$$('.errtxt').forEach(x=>x.remove());let bad=null;$$('[required]',$('#wf')).forEach(x=>{if(!x.value.trim()){const p=document.createElement('div');p.className='errtxt';p.textContent='This field is required.';x.closest('.f').appendChild(p);if(!bad)bad=x;}});if(bad){bad.focus();return;}save();if(step<steps.length-1){step++;draw();window.scrollTo({top:$('#wz').getBoundingClientRect().top+window.scrollY-140});}else brief();});
 }
 function save(){$$('input,select,textarea',$('#wf')).forEach(x=>{if(x.id&&x.id.startsWith('m-')&&x.type!=='checkbox')d[x.id]=x.value;});if($('#m-caps'))d.caps=$$('#m-caps input:checked').map(i=>i.value);}
 function brief(){
  const ind=INDUSTRIES.find(i=>i.n===d['m-ind']);
  const cp=(d.caps&&d.caps.length)?d.caps:['to be defined in discussion'];
  const tl={'Urgent (as soon as possible)':'An accelerated search architecture with early market mapping and a compressed first-slate timetable, balancing speed against depth of assessment.','Within 3 months':'A focused retained-search architecture: mandate definition, rapid market mapping, targeted outreach and a finalist slate within the window.','3 to 6 months':'A full six-stage architecture, allowing broader market mapping, deeper assessment and considered stakeholder alignment.','Flexible':'A staged architecture that prioritises the quality of the mandate and market understanding before outreach begins.'}[d['m-time']];
  const board=d['m-board']?` Board involvement: ${esc(d['m-board'].toLowerCase())}.`:'';
  const sec=(t,b)=>`<section><h4>${t}</h4><div>${b}</div></section>`;
  root.innerHTML=`<div class="brief" id="bf"><p class="meta" style="color:var(--gold-ink);margin-bottom:14px">Leadership Mandate Brief · Draft</p><h3 tabindex="-1" id="bh">${esc(d['m-role'])}</h3><p class="soft" style="margin-bottom:24px">${esc(d['m-org'])} · ${esc(d['m-ind'])} · ${esc(d['m-geo'])}</p>
  ${sec('Context',`<p>${esc(d['m-org'])} is a ${esc(d['m-stage'].toLowerCase())} organization in ${esc(d['m-ind'])}. The stated business challenge: ${esc(d['m-ch'])}${d['m-tf']?` The transformation agenda: ${esc(d['m-tf'])}`:''}</p>`)}
  ${sec('Leadership challenge',`<p>The appointment matters because the ${esc(d['m-role'])} must address the challenge above while delivering against these priorities: ${esc(d['m-pri'])}${board}</p>`)}
  ${sec('Required capabilities',`<ul>${cp.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>`)}
  ${sec('Market',`<p>The search would begin in ${esc(d['m-ind'])} within ${esc(d['m-geo'])}, then extend to adjacent sectors where comparable complexity exists.${ind?` Typical leadership themes in this sector include ${ind.th.map(esc).join(', ').toLowerCase()}.`:''}</p>`)}
  ${sec('Assessment',`<p>Candidates would be assessed on context, capability, character, complexity and contribution, with particular weight on ${cp.slice(0,3).map(c=>esc(c).toLowerCase()).join(', ')}.</p>`)}
  ${sec('Timeline',`<p>${tl} Confidentiality level requested: ${esc(d['m-conf'].toLowerCase())}.</p>`)}
  <p class="note">Automated summary generated from your answers. It is not a formal consulting deliverable and has not been reviewed by ROYCE.</p>
  <div class="btnrow no-print"><a class="btn" href="#/contact">Discuss This Mandate Confidentially</a><button class="btn ghost" type="button" id="wr">Start again</button><button class="btn ghost" type="button" id="wp">Print or save as PDF</button></div></div>`;
  $('#bh').focus();$('#wr').onclick=()=>{Object.keys(d).forEach(k=>delete d[k]);step=0;draw();};$('#wp').onclick=()=>window.print();
 }
 draw();
}

/* ---------- board readiness ---------- */
function initReadiness(){
 const root=$('#br');if(!root)return;
 const DIM=['Strategic Perspective','Governance Fluency','Stakeholder Judgment','Risk Awareness','Technology Fluency','Board Communication'];
 const Q=[
  [0,'I regularly shape strategy at the enterprise level, not only within my function.'],
  [0,'I can explain how my industry may look in ten years and what that means for the business.'],
  [1,'I understand the respective roles of the board, its committees and management.'],
  [1,'I can distinguish oversight from management and act accordingly.'],
  [2,'I have built credibility with investors, regulators or other external stakeholders.'],
  [2,'I can weigh competing stakeholder interests in a consequential decision.'],
  [3,'I have led or advised through a material risk or crisis event.'],
  [3,'I can read financial statements and challenge the assumptions behind them.'],
  [4,'I can ask informed questions about technology, data and cyber risk without being a specialist.'],
  [4,'I understand how AI and digital change affect strategy and risk in my sector.'],
  [5,'I can communicate concisely and persuasively to a senior, non-executive audience.'],
  [5,'I contribute independently in groups, including when my view differs from the room.']
 ];
 const opts=['Not yet','Partly','Largely','Strongly'];
 const band=v=>v<1.75?'Emerging':v<2.5?'Developing':v<3.25?'Established':'Strong';
 const note={'Emerging':'An area to build deliberately before a board role.','Developing':'Foundations exist; more exposure would strengthen this.','Established':'A clear area of capability.','Strong':'A distinguishing strength to bring to a board.'};
 root.innerHTML=`<form id="bq" novalidate><div id="bqs">${Q.map((q,i)=>`<fieldset class="q"><legend class="sr">Statement ${i+1}</legend><p>${q[1]}</p><div class="scale" role="radiogroup" aria-label="Statement ${i+1}">${opts.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j+1}" ${j===0?'required':''}><span>${o}</span></label>`).join('')}</div></fieldset>`).join('')}</div><div class="btnrow"><button class="btn" type="submit">See my Board Readiness Profile</button></div><div id="bqe" role="alert"></div></form>`;
 $('#bq').addEventListener('submit',e=>{
  e.preventDefault();
  const miss=Q.findIndex((_,i)=>!$(`input[name=q${i}]:checked`));
  if(miss>=0){$('#bqe').innerHTML=`<div class="errtxt">Please answer statement ${miss+1} to continue.</div>`;$(`input[name=q${miss}]`).focus();return;}
  const sc=DIM.map((_,di)=>{const v=Q.map((q,i)=>q[0]===di?+$(`input[name=q${i}]:checked`).value:null).filter(x=>x);return v.reduce((a,b)=>a+b,0)/v.length;});
  root.innerHTML=`<p class="meta" style="color:var(--gold-ink);margin-bottom:12px">Informational self-assessment</p><h2 class="h2" id="rh" tabindex="-1">Your Board Readiness Profile</h2><div class="bars">${DIM.map((n,i)=>{const b=band(sc[i]);return `<div class="bar2"><div class="top"><span>${n}</span><span>${b}</span></div><div class="track"><div class="fill" data-w="${(sc[i]/4*100).toFixed(0)}"></div></div><p>${note[b]}</p></div>`;}).join('')}</div><p class="note">This profile reflects your own answers. It is informational only and is not a certification, accreditation or objective professional qualification.</p><div class="btnrow"><a class="btn" href="#/contact/executives">Discuss Your Board Readiness</a><button class="btn ghost" type="button" id="brr">Retake</button></div>`;
  $('#rh').focus();requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.fill',root).forEach(f=>f.style.width=f.dataset.w+'%')));
  $('#brr').onclick=initReadiness;
 });
}
